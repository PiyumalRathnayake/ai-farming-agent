services:
  postgres:
    image: postgres:17-alpine
    container_name: ai-farming-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: farmer
      POSTGRES_PASSWORD: farmer_password
      POSTGRES_DB: ai_farming
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmer -d ai_farming"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-farming-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://farmer:farmer_password@postgres:5432/ai_farming
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "python -m alembic upgrade head && exec python -m uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
